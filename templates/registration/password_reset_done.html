{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Email Sent</title>

    <link rel="stylesheet"
          href="{% static 'css/password_reset_done.css' %}">
</head>

<body>

    <div class="done-container">

        <!-- Logo -->
        <div class="logo">
            <span class="logo-icon">🤖</span>
            AI<span class="logo-highlight">Interviewer</span>
        </div>


        <!-- Success Card -->
        <div class="done-card">

            <div class="success-icon">
                📧
            </div>

            <h1>Check Your Email</h1>

            <p>
                We've emailed you instructions for resetting
                your password.
            </p>

            <p>
                If an account exists with the email address
                you entered, you will receive a password
                reset link shortly.
            </p>

            <a href="{% url 'login' %}" class="back-login">
                ← Back to Login
            </a>

        </div>

    </div>

</body>
</html>
